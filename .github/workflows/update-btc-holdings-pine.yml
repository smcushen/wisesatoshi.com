name: Update TradingView Indicators

on:
  push:
    branches: [main]
    paths:
      - data/strategy-fundamentals.json
  workflow_dispatch:  # run manually anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update holdings history and regenerate Pine scripts
        run: python scripts/update_btc_holdings_pine.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/btc-holdings-history.json tradingview/mstr-btc-holdings.pine tradingview/mstr-mnav.pine
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update TradingView indicators (BTC holdings + mNAV)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          exit 1
