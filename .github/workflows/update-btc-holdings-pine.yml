name: Update BTC Holdings Indicator

on:
  push:
    branches: [main]
    paths:
      - data/strategy-fundamentals.json
  workflow_dispatch:  # run manually anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update holdings history and regenerate Pine script
        run: python scripts/update_btc_holdings_pine.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/btc-holdings-history.json tradingview/mstr-btc-holdings.pine
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update BTC holdings history + TradingView indicator"
          git pull --rebase origin main
          git push
