name: Capture mNAV At Market Close

on:
  schedule:
    # Once per weekday, ~20 min after NYSE close (4:00 PM ET = 20:00 UTC
    # during EDT). Once Eastern time shifts to EST (~early Nov), this needs
    # to move to '20 21 * * 1-5' to keep landing ~20 min after the real
    # close — same DST pattern as the other scheduled workflows in this repo.
    # A modest delay past the real close is harmless here: MSTR's closing
    # price is fixed once the market shuts, so only the BTC price gets
    # slightly less precise the later this actually runs.
    - cron: '20 20 * * 1-5'
  workflow_dispatch:  # allows manual trigger anytime

permissions:
  contents: write

jobs:
  capture-close-mnav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch MSTR closing price from Finnhub
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          RESPONSE=$(curl -s "https://finnhub.io/api/v1/quote?symbol=MSTR&token=$FINNHUB_API_KEY")
          PRICE=$(echo "$RESPONSE" | jq '.c')

          # Guard against a failed fetch or an empty/zero quote — never commit bad data.
          if [ -z "$PRICE" ] || [ "$PRICE" == "null" ] || [ "$PRICE" == "0" ]; then
            echo "Failed to fetch MSTR price — aborting without committing."
            exit 1
          fi
          echo "MSTR_PRICE=$PRICE" >> "$GITHUB_ENV"

      - name: Fetch BTC price from CoinGecko
        run: |
          RESPONSE=$(curl -s "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd")
          BTC_PRICE=$(echo "$RESPONSE" | jq '.bitcoin.usd')

          if [ -z "$BTC_PRICE" ] || [ "$BTC_PRICE" == "null" ] || [ "$BTC_PRICE" == "0" ]; then
            echo "Failed to fetch BTC price — aborting without committing."
            exit 1
          fi
          echo "BTC_PRICE=$BTC_PRICE" >> "$GITHUB_ENV"

      - name: Compute close-time mNAV and write snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Same formula as index.html's inline calcNetValuePerShare() — this
            // runs in a separate context (Node, not the browser) so it's a
            // manual copy, kept in sync by hand rather than shared by import.
            function calcNetValuePerShare(btcHeld, btcPrice, debtB, preferredB, usdReserveB, usdCashB, sharesM){
              const shares = sharesM * 1e6;
              const debt = debtB * 1e9;
              const preferred = preferredB * 1e9;
              const usdReserve = usdReserveB * 1e9;
              const usdCash = usdCashB * 1e9;
              const debtBtc = debt / btcPrice;
              const preferredBtc = preferred / btcPrice;
              const reserveBtc = usdReserve / btcPrice;
              const cashBtc = usdCash / btcPrice;
              const netBtc = btcHeld - debtBtc - preferredBtc + reserveBtc + cashBtc;
              const netBtcPerShare = netBtc / shares;
              return netBtcPerShare * btcPrice;
            }

            // Trading-day label uses the US Eastern calendar date, not UTC.
            // Reason: this job is scheduled ~20 min after the 4:00 PM ET close,
            // but can run hours late during a GitHub Actions incident (as
            // happened Aug 26 — scheduled 12:20 PM, actually ran 3:22 PM). US
            // Eastern doesn't roll into the next UTC calendar day until 8:00 PM
            // ET, so a UTC-based date label only mislabels the trading day if
            // the job runs more than ~4 hours late — not a hypothetical edge
            // case for this repo, given the incident above. Eastern-calendar
            // labeling pushes that buffer out to a full 24 hours instead.
            function easternDateString(date) {
              const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
              }).formatToParts(date);
              const y = parts.find(p => p.type === 'year').value;
              const m = parts.find(p => p.type === 'month').value;
              const d = parts.find(p => p.type === 'day').value;
              return `${y}-${m}-${d}`;
            }

            const mstrPrice = parseFloat(process.env.MSTR_PRICE);
            const btcPrice = parseFloat(process.env.BTC_PRICE);
            const fundamentals = JSON.parse(fs.readFileSync('data/strategy-fundamentals.json', 'utf8'));

            const netValuePerShare = calcNetValuePerShare(
              fundamentals.btcHeld,
              btcPrice,
              fundamentals.convertibleDebtBillions,
              fundamentals.preferredStockBillions,
              fundamentals.usdReserveBillions,
              fundamentals.usdCashBillions || 0,
              fundamentals.sharesOutstandingMillions
            );
            const mnav = mstrPrice / netValuePerShare;

            const now = new Date();
            const snapshot = {
              mstrClosePrice: mstrPrice,
              btcPriceAtClose: btcPrice,
              netValuePerShareAtClose: netValuePerShare,
              mnav: mnav,
              marketDate: easternDateString(now),
              capturedAt: now.toISOString()
            };

            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/mnav-close-snapshot.json', JSON.stringify(snapshot, null, 2) + '\n');

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mnav-close-snapshot.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Capture mNAV at market close"
          git push
