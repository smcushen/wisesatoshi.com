name: Capture Treasury Rate

on:
  schedule:
    # 4x/day, weekdays — matches the existing call cadence, just sourced
    # directly from Treasury instead of through the Netlify function.
    - cron: '0 */6 * * 1-5'
  workflow_dispatch:  # allows manual trigger anytime

permissions:
  contents: write

jobs:
  capture-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and parse Treasury par yield curve
        run: |
          YEAR=$(date -u +%Y)
          curl -s "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xmlview?data=daily_treasury_yield_curve&field_tdr_date_value=$YEAR" -o rates.xml

          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import json, sys, os

          # Confirmed against Treasury's own documented XML feed structure
          # (home.treasury.gov/treasury-daily-interest-rate-xml-feed) before
          # building this, rather than guessed. BC_1YEAR is the 1-year
          # Constant Maturity Treasury rate — a standard, commonly used
          # risk-free-rate proxy.
          ns = {
              'atom': 'http://www.w3.org/2005/Atom',
              'm': 'http://schemas.microsoft.com/ado/2007/08/dataservices/metadata',
              'd': 'http://schemas.microsoft.com/ado/2007/08/dataservices'
          }
          tree = ET.parse('rates.xml')
          root = tree.getroot()
          entries = root.findall('atom:entry', ns)
          if not entries:
              print("No entries found in feed -- aborting without committing.")
              sys.exit(1)

          # Entries come in chronological order -- the last one is the most
          # recent trading day published so far this year.
          last = entries[-1]
          props = last.find('.//m:properties', ns)
          date_el = props.find('d:NEW_DATE', ns) if props is not None else None
          rate_el = props.find('d:BC_1YEAR', ns) if props is not None else None

          if date_el is None or rate_el is None or not rate_el.text:
              print("Missing expected fields in latest entry -- aborting without committing.")
              sys.exit(1)

          date_str = date_el.text.split('T')[0]
          rate = float(rate_el.text)

          os.makedirs('data', exist_ok=True)
          with open('data/treasury-rate.json', 'w') as f:
              json.dump({'rate': rate, 'date': date_str}, f, indent=2)
              f.write('\n')
          print(f"Captured {date_str}: {rate}%")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/treasury-rate.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Capture Treasury rate"
          git push
