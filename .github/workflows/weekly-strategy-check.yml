name: Weekly Strategy Fundamentals Check
on:
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:  # allows manual trigger anytime
jobs:
  create-reminder:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create weekly fundamentals reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            const f = JSON.parse(fs.readFileSync('data/strategy-fundamentals.json', 'utf8'));

            // Checks whether the hardcoded NYSE holiday lists in
            // capture-mnav-close.yml still cover next year. Those lists need
            // a human to extend them once a year — this just makes sure that
            // never gets forgotten by piggybacking on a reminder that's
            // already running weekly, rather than needing its own schedule.
            const captureWorkflowPath = '.github/workflows/check-mnav-close-captured.yml';
            const captureWorkflowText = fs.existsSync(captureWorkflowPath)
              ? fs.readFileSync(captureWorkflowPath, 'utf8')
              : '';
            const nextYear = new Date().getFullYear() + 1;
            const holidayListCoversNextYear = captureWorkflowText.includes(`HOLIDAYS_${nextYear}`);

            const holidaySection = holidayListCoversNextYear ? '' : `
            ### ⚠ Holiday list needs updating
            - [ ] \`check-mnav-close-captured.yml\` doesn't yet have an \`HOLIDAYS_${nextYear}\` entry. Check [NYSE's published holiday calendar](https://www.nyse.com/markets/hours-calendars) (usually out ~13 months ahead) and add ${nextYear}'s dates there, plus in the mNAV-close capture's own holiday list if it has one (see \`netlify/functions\`).
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Strategy Fundamentals Check — ${today}`,
              body: `## WS Model — Weekly Data Verification

            ### Step 0 — Confirm nothing new
            - [ ] Checked strategy.com/shares, the investor briefing, and the latest 8-K — if nothing has changed since \`${f.lastUpdated}\`, close this issue with no edits needed.

            ### Step 1 — Check strategy.com/shares
            - [ ] **BTC held** (current: ${f.btcHeld.toLocaleString('en-US')})
            - [ ] **Basic shares outstanding** (current: ${f.sharesOutstandingMillions}M)

            ### Step 2 — Check Strategy investor briefing
            - [ ] **USD Reserve** (current: $${f.usdReserveBillions}B)
            - [ ] **USD Cash** (current: $${f.usdCashBillions ?? 'not set'}B)
            - [ ] **Preferred stock — STRK/STRF/STRD/STRC** (current: $${f.preferredStockBillions}B)
            - [ ] **Fully Diluted Shares Outstanding (FDSO)** (current: ${f.fdsoMillions ?? 'not set'}M)
            - [ ] **Annual interest + preferred dividends — Cost of Capital** (current: $${f.annualInterestAndPrefDividendsBillions ?? 'not set'}B)
            ### Step 3 — Check latest SEC 8-K filing
            - [ ] **Convertible debt** (current: $${f.convertibleDebtBillions}B)
            ${holidaySection}
            ### Update this week's numbers
            👉 If anything changed, ask Claude for this week's Strategy fundamentals JSON, then paste it directly into \`data/strategy-fundamentals.json\` on GitHub and commit. Set \`lastUpdated\` to the **8-K's date**.

            ### Step 4 — Update TradingView
            - [ ] Wait ~1 minute for **Update TradingView Indicators** to finish (Actions tab)
            - [ ] Paste \`tradingview/mstr-btc-holdings.pine\` into the BTC Holdings indicator → Save
            - [ ] Paste \`tradingview/mstr-mnav.pine\` into the mNAV indicator → Save

            **Sources:**
            - [strategy.com/shares](https://strategy.com/shares)
            - [SEC EDGAR — MSTR filings](https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=MSTR&type=8-K&dateb=&owner=include&count=10)

            *Close this issue manually once you've confirmed or updated the file.*`,
              labels: ['maintenance', 'data-update']
            });

            console.log('Weekly reminder issue created successfully');
