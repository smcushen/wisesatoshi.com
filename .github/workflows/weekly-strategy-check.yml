name: Weekly Strategy Fundamentals Check
on:
  schedule:
    # Every Monday at 8:00 PM Alaska time (AKDT, UTC-8). Note: once Alaska
    # shifts to AKST (UTC-9) around Nov 1, this will fire at 7:00 PM Alaska
    # time instead of 8:00 PM — change to '0 5 * * 2' to hold 8:00 PM through
    # the winter. Same DST caveat as the daily breakdown bot.
    - cron: '0 4 * * 2'
  workflow_dispatch:  # allows manual trigger anytime
jobs:
  create-reminder:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create weekly fundamentals reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const formUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new?template=strategy-update.yml`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Strategy Fundamentals Check — ${today}`,
              body: `## WS Model — Weekly Data Verification
            
            It's Tuesday. Strategy typically announces Bitcoin purchases on Mondays, so today is the right time to verify all model defaults.
            
            ### Step 1 — Check strategy.com/shares
            - [ ] **BTC held** (current default: 840,447)
            - [ ] **Basic shares outstanding** (current default: 401M)
            
            ### Step 2 — Check Strategy investor briefing
            - [ ] **USD Reserve** (current default: $4.65B)
            - [ ] **Preferred stock — STRK/STRF/STRD/STRC** (current default: $15.24B)
            
            ### Step 3 — Check latest SEC 8-K filing
            - [ ] **Convertible debt** (current default: $6.75B)
            
            ### Submit this week's numbers
            👉 [Click here to open the update form](${formUrl})
            
            Fill in all five fields (even if unchanged) and submit — a bot will automatically update the site and close this reminder.
            
            **Sources:**
            - [strategy.com/shares](https://strategy.com/shares)
            - [SEC EDGAR — MSTR filings](https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=MSTR&type=8-K&dateb=&owner=include&count=10)
            
            *This reminder closes automatically once you submit the form above.*`,
              labels: ['maintenance', 'data-update']
            });
            
            console.log('Weekly reminder issue created successfully');
