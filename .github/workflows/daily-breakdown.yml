name: Daily Breakdown Bot

on:
  schedule:
        - cron: '53 12 * * *'   # 12:53 UTC daily = 8:53 AM Eastern (EDT, UTC-4). Offset 7 min off the hour to dodge GitHub's peak-load congestion at :00. Will read as 7:53 AM Eastern once clocks shift to EST (UTC-5) in November -- see /areas/daily-breakdown-automation.md for the DST note.
  workflow_dispatch:        # lets you trigger it manually from GitHub's Actions tab, for testing

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy requests

      - name: Run Daily Breakdown script
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python post_daily_breakdown.py
