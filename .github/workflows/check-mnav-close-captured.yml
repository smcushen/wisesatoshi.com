name: Check mNAV Close Snapshot Captured

on:
  schedule:
    # Once per weekday, 18:00 ET (22:00 UTC during EDT) — over an hour after
    # the last retry attempt in capture-mnav-close.yml (17:00 ET), so this
    # only fires once every real retry has already had its chance. Once
    # Eastern shifts to EST (~early Nov), move to '0 23 * * 1-5' — same DST
    # pattern as the other scheduled workflows in this repo.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # allows manual trigger anytime

permissions:
  contents: read
  issues: write

jobs:
  check-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compare snapshot date to today
        id: check
        run: |
          TODAY_ET=$(TZ='America/New_York' date +%F)
          if [ -f data/mnav-close-snapshot.json ]; then
            EXISTING_DATE=$(jq -r '.marketDate // empty' data/mnav-close-snapshot.json)
          else
            EXISTING_DATE=""
          fi
          echo "today=$TODAY_ET" >> "$GITHUB_OUTPUT"
          echo "existing=$EXISTING_DATE" >> "$GITHUB_OUTPUT"

      - name: File an issue if today's close is missing
        if: steps.check.outputs.today != steps.check.outputs.existing
        uses: actions/github-script@v7
        with:
          script: |
            const today = '${{ steps.check.outputs.today }}';
            const existing = '${{ steps.check.outputs.existing }}' || 'none on file';

            // Avoid filing a duplicate if this workflow gets re-run manually
            // on a day an issue was already opened for.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-freshness'
            });
            const alreadyFiled = openIssues.some(issue => issue.title.includes(today));
            if (alreadyFiled) {
              console.log('Issue already filed for ' + today + ' — skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠ mNAV close snapshot missing for ${today}`,
              body: `None of today's scheduled capture attempts in \`capture-mnav-close.yml\` succeeded — the live site is still showing the close from **${existing}**.

**To fix now:** go to Actions → Capture mNAV At Market Close → Run workflow.

**To investigate:** check the run history for today's four scheduled attempts (20:20, 20:35, 20:50, 21:00 UTC) and see whether they failed or never started — the latter usually means [githubstatus.com](https://www.githubstatus.com/history) shows an Actions incident today.`,
              labels: ['bug', 'data-freshness']
            });

            console.log('Filed missing-snapshot issue for ' + today);
