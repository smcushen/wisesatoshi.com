name: Refresh MSTR Price

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes — direct from Finnhub, zero cost regardless of frequency
  workflow_dispatch:  # allows manual trigger anytime

permissions:
  contents: write

jobs:
  refresh-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch MSTR price from Finnhub
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          RESPONSE=$(curl -s "https://finnhub.io/api/v1/quote?symbol=MSTR&token=$FINNHUB_API_KEY")
          PRICE=$(echo "$RESPONSE" | jq '.c')

          # Guard against a failed fetch or an empty/zero quote — never commit bad data.
          # If this run fails, the last known-good file just stays as-is.
          if [ -z "$PRICE" ] || [ "$PRICE" == "null" ] || [ "$PRICE" == "0" ]; then
            echo "Failed to fetch MSTR price — aborting without committing."
            exit 1
          fi

          mkdir -p data
          cat > data/mstr-price.json << EOF
          {
            "price": $PRICE,
            "lastFetched": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mstr-price.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Refresh MSTR price"
          git push
