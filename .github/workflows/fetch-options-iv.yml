name: Fetch Options IV

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-iv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch options IV
        env:
          MARKETDATA_API_KEY: ${{ secrets.MARKETDATA_API_KEY }}
        run: node scripts/fetch-options-iv.mjs

      - name: Commit updated IV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mstr-options-iv.json
          git diff --staged --quiet || git commit -m "Update options IV data"
          git pull --rebase origin main
          git push
