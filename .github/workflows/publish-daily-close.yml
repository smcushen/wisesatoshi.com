name: Publish Daily Close Deploy

on:
  schedule:
    # Four attempts spread across the post-close window, matching the same
    # pattern mnav-close-core.mjs's capture step needed — GitHub's scheduler
    # has shown delays of 20 min to several hours on this repo, so relying on
    # a single fire time isn't reliable. Idempotency is handled naturally:
    # once the right deploy is live, later attempts just re-publish the same
    # one (harmless) rather than needing their own separate guard.
    #
    # Times are ~35/50/65/80 min after the 4:20pm ET close capture, written
    # in UTC while ET is UTC-4 (EDT). Once ET shifts to UTC-5 (EST, ~early
    # Nov), shift all four by +1 hour in UTC — same DST pattern as the other
    # scheduled workflows in this repo.
    - cron: '35 20 * * 1-5'
    - cron: '50 20 * * 1-5'
    - cron: '5 21 * * 1-5'
    - cron: '20 21 * * 1-5'
  workflow_dispatch:  # allows manual trigger anytime, for testing

jobs:
  publish-latest-ready-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip on NYSE holidays
        id: guard
        run: |
          TODAY_ET=$(TZ='America/New_York' date +%F)

          # Same NYSE holiday list as mnav-close-core.mjs — kept in sync by
          # hand across both files, since neither can literally import from
          # the other.
          HOLIDAYS_2026="2026-01-01 2026-01-19 2026-02-16 2026-04-03 2026-05-25 2026-06-19 2026-07-03 2026-09-07 2026-11-26 2026-12-25"
          HOLIDAYS_2027="2027-01-01 2027-01-18 2027-02-15 2027-03-26 2027-05-31 2027-06-18 2027-07-05 2027-09-06 2027-11-25 2027-12-24"
          HOLIDAYS="$HOLIDAYS_2026 $HOLIDAYS_2027"

          IS_HOLIDAY="false"
          for d in $HOLIDAYS; do
            if [ "$d" == "$TODAY_ET" ]; then
              IS_HOLIDAY="true"
              break
            fi
          done

          if [ "$IS_HOLIDAY" == "true" ]; then
            echo "$TODAY_ET is an NYSE holiday — skipping publish."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Find and publish the most recent ready deploy
        if: env.skip != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # Pull the last 10 deploys rather than just 1 — the single newest
          # one can easily be "canceled" or still "building" if a later
          # automated commit landed moments before this ran (exactly what
          # happened the first time this workflow fired: it grabbed the
          # newest deploy, found it not-ready, and gave up instead of
          # falling back to the most recent one that WAS actually ready).
          DEPLOYS=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?branch=main&per_page=10")

          DEPLOY_ID=$(echo "$DEPLOYS" | jq -r '[.[] | select(.state == "ready")][0].id')

          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" == "null" ]; then
            echo "No ready deploy found among the last 10 — skipping this attempt."
            exit 0
          fi

          echo "Publishing deploy $DEPLOY_ID..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys/$DEPLOY_ID/restore")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Restore failed with HTTP $HTTP_CODE — see response body above."
            echo "$RESPONSE" | head -n -1
            exit 1
          fi

          echo "Published successfully."
